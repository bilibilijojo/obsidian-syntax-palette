name: Prepare draft GitHub release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing version tag, exactly matching manifest.json and without a leading v
        required: true
        type: string
      authorize_draft_release:
        description: I reviewed the release candidate and authorize creating a draft release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-draft-${{ github.repository }}-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  draft:
    name: Validate and create a non-public draft
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Require explicit authorization and an existing version tag
        env:
          AUTHORIZED: ${{ inputs.authorize_draft_release }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          [[ "$AUTHORIZED" == "true" ]] || { echo "Draft release authorization was not selected." >&2; exit 1; }
          [[ "$REF_TYPE" == "tag" ]] || { echo "Run this workflow from an existing version tag." >&2; exit 1; }
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be x.y.z, without a leading v." >&2; exit 1; }
          [[ "$REF_NAME" == "$REQUESTED_VERSION" ]] || { echo "Selected tag and confirmed version differ." >&2; exit 1; }
          [[ "$REPOSITORY_VISIBILITY" == "public" ]] || { echo "This workflow only creates releases on a public assets repository. The source repository is private." >&2; exit 1; }

      - name: Check out the selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the pinned Node.js version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Verify the tag, manifest, and owner-confirmed metadata
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); const m=require("./manifest.json"); if(p.version!==process.env.REQUESTED_VERSION || m.version!==p.version) process.exit(1);'
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]] || { echo "Checked out commit does not match the selected tag." >&2; exit 1; }
          npm run check-release-metadata -- --for-release

      - name: Install locked dependencies
        run: npm ci

      - name: Run all release validations
        run: npm run verify

      - name: Build and package
        run: npm run build && npm run package && npm run verify-build

      - name: Create a new draft release without replacing history
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_VERSION; refusing to replace it." >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/syntax-palette-release-notes.md"
          {
            cat "docs/releases/${RELEASE_VERSION}.md"
            printf '\n\n'
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Review this draft and its attached assets before publishing.\n\n'
            printf 'SHA-256 checksums:\n\n````text\n'
            sha256sum "plugin/syntax-palette/main.js" \
              "plugin/syntax-palette/manifest.json" \
              "plugin/syntax-palette/styles.css" \
              "plugin/syntax-palette/THIRD-PARTY-NOTICES.txt" \
              "syntax-palette-${RELEASE_VERSION}.zip"
            printf '````\n'
          } > "$notes"
          gh release create "$RELEASE_VERSION" \
            --verify-tag \
            --draft \
            --title "Syntax Palette ${RELEASE_VERSION} — Initial public release" \
            --notes-file "$notes" \
            "plugin/syntax-palette/main.js" \
            "plugin/syntax-palette/manifest.json" \
            "plugin/syntax-palette/styles.css" \
            "plugin/syntax-palette/THIRD-PARTY-NOTICES.txt" \
            "plugin/syntax-palette/SHA256SUMS.txt" \
            "syntax-palette-${RELEASE_VERSION}.zip" \
            "syntax-palette-${RELEASE_VERSION}.zip.sha256"
